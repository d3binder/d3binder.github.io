<style>
  :root {
    --bg-1: #F6F3EC;
    --bg-2: #F6F3EC;
    --card: #ffffff;
    --card-hover: #FCF3DE;
    --accent: #DB6A2E;
    --accent-2: #D9840F;
    --sage: #1F9254;
    --text-main: #26221C;
    --text-dim: #8C5A46;
    --border-color: rgba(154,79,42,0.18);
  }

  /* ---------- VIBRANT DARK MODE ---------- */
  :root[data-theme="dark"] {
    --bg-1: #15111A;
    --bg-2: #1E1826;
    --card: #1E1826;
    --card-hover: #241C30;
    --accent: #FF9A6E;
    --accent-2: #F3B23A;
    --sage: #4FDB8F;
    --text-main: #F3EEE4;
    --text-dim: #B8A8C0;
    --border-color: rgba(255,255,255,0.14);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 20% -10%, rgba(217,132,15,0.16) 0%, transparent 45%),
                radial-gradient(circle at 90% 0%, rgba(31,146,84,0.14) 0%, transparent 40%),
                radial-gradient(circle at 50% 110%, rgba(156,63,174,0.08) 0%, transparent 50%),
                linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
    color: var(--text-main);
  }

  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  header {
    text-align: center;
    margin-bottom: 48px;
  }

  header .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #201205;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 18px;
  }

  header h1 {
    font-size: clamp(28px, 4vw, 40px);
    margin: 0 0 10px;
    letter-spacing: -0.02em;
  }

  header p {
    color: var(--text-dim);
    font-size: 15px;
    margin: 0;
  }

  section.section-title {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 40px 0 16px;
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  section.section-title::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--border-color), transparent);
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border-color);
    border-top: 4px solid var(--sage);
    border-radius: 18px;
    transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
  }

  /* Spreadsheet card */
  .file-card {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 22px 24px;
    margin-bottom: 25px;
    text-decoration: none;
    color: inherit;
  }

  .file-card:hover {
    border-color: rgba(219, 106, 46, 0.5);
    background: var(--card-hover);
    transform: translateY(-2px);
  }

  a.file-card.old-card {
    border-top-color: rgb(79, 143, 219) !important;
  }

  .file-icon {
    flex-shrink: 0;
    width: 56px;
    height: 56px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    background: linear-gradient(135deg, #2FAE6B, #0F5C34);
    box-shadow: 0 6px 18px rgba(15, 92, 52, 0.3);
  }

  .file-info {
    flex: 1;
    min-width: 0;
  }

  .file-info .name {
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .file-info .meta {
    font-size: 13px;
    color: var(--text-dim);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .file-info .meta span::before {
    content: "•";
    margin-right: 10px;
    color: var(--border-color);
  }

  .file-info .meta span:first-child::before {
    content: "";
    margin-right: 0;
  }

  .download-pill {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(219, 106, 46, 0.12);
    color: var(--accent-2);
    border: 1px solid rgba(219, 106, 46, 0.35);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }

  .file-card:hover .download-pill {
    background: var(--accent);
    color: #201205;
    border-color: var(--accent);
  }

  /* Video card */
  .video-card {
    padding: 22px;
    border-top-color: var(--accent);
  }

  .video-card .video-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .video-card .video-title {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .video-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, #F3B23A, #DB6A2E);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    box-shadow: 0 6px 18px rgba(219, 106, 46, 0.3);
  }

  .video-title .name {
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 3px;
  }

  .video-title .meta {
    font-size: 13px;
    color: var(--text-dim);
  }

  .open-native {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent-2);
    text-decoration: none;
    border: 1px solid rgba(217, 132, 15, 0.3);
    padding: 8px 14px;
    border-radius: 999px;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .open-native:hover {
    background: var(--accent);
    color: #201205;
    border-color: var(--accent);
  }

  .open-native.is-disabled {
    color: var(--text-dim);
    border-color: var(--border-color);
    opacity: 0.5;
    cursor: not-allowed;
    pointer-events: none;
  }

  .open-native.is-disabled:hover {
    background: none;
    color: var(--text-dim);
    border-color: var(--border-color);
  }

  video {
    width: 100%;
    border-radius: 12px;
    background: #000;
    display: block;
    max-height: 540px;
  }

  .video-fallback {
    padding: 40px 20px;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
    background: var(--card-hover);
    border-radius: 12px;
    border: 1px dashed var(--border-color);
  }

  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 12.5px;
    margin-top: 56px;
  }

  footer a { color: var(--accent-2); }
</style>
</head>

    <section class="section-title">Downloads</section>

    <a class="card file-card" href="files/Nates F.I.R.E. Spreadsheet 15.0.xlsm" download>
      <div class="file-icon">📊</div>
      <div class="file-info">
        <p class="name">Nates F.I.R.E. Spreadsheet 15.0.xlsm</p>
        <div class="meta">
          <span>Excel Macro-Enabled Workbook</span>
          <span>.xlsm</span>
        </div>
      </div>

    <a class="card file-card old-card" href="files/Nates F.I.R.E. Spreadsheet 13.0.xlsm" download>
      <div class="file-icon">📊</div>
      <div class="file-info">
        <p class="name">Nates F.I.R.E. Spreadsheet 13.0.xlsm</p>
        <div class="meta">
          <span>Excel Macro-Enabled Workbook</span>
          <span>.xlsm</span>
        </div>
      </div>
      <span class="download-pill">⬇ Download</span>
    </a>

    <section class="section-title">Video Player</section>
    <div class="card video-card">
      <div class="video-head">
        <div class="video-title">
          <div class="video-icon">🎬</div>
          <div>
            <p class="name">FireNate.mp4</p>
            <p class="meta">MPEG-4 Video</p>
          </div>
        </div>
        <a class="open-native is-disabled" href="videos/FireNate.mp4" download aria-disabled="true" tabindex="-1" onclick="return false;">⬇ Download video</a>
      </div>

      <video controls preload="metadata">
        <source src="videos/FireNate.mp4" type="video/mp4">
        <div class="video-fallback">
          Your browser can't play this video inline. Use the download link above to open it.
        </div>
      </video>
    </div>


  </div>

<footer id="site-footer"></footer>

</body>
</html>
