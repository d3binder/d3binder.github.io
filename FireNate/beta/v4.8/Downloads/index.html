<style>
  :root {
    --bg-1: #F6F3EC;
    --bg-2: #F6F3EC;
    --card: #ffffff;
    --card-hover: #FCF3DE;
    --accent: #DB6A2E;
    --accent-2: #D9840F;
    --sage: #1F9254;
    --text-main: #26221C;
    --text-dim: #8C5A46;
    --border-color: rgba(154,79,42,0.18);
  }

  /* ---------- VIBRANT DARK MODE ---------- */
  :root[data-theme="dark"] {
    --bg-1: #15111A;
    --bg-2: #1E1826;
    --card: #1E1826;
    --card-hover: #241C30;
    --accent: #FF9A6E;
    --accent-2: #F3B23A;
    --sage: #4FDB8F;
    --text-main: #F3EEE4;
    --text-dim: #B8A8C0;
    --border-color: rgba(255,255,255,0.14);
  }

  /* ---------- MODERN NEON GLASS ---------- */
  :root[data-theme="neon"] {
    --bg-1: #020617;
    --bg-2: #0b1120;
    --card: rgba(255,255,255,0.06);
    --card-hover: rgba(255,255,255,0.1);
    --accent: #a855f7;
    --accent-2: #ec4899;
    --sage: #34d399;
    --text-main: #e5e7eb;
    --text-dim: #9ca3af;
    --border-color: rgba(168,85,247,0.25);
  }

  /* ---------- MODERN SUNSHINE GLASS ---------- */
  :root[data-theme="sunshine"] {
    --bg-1: #eaf5fd;
    --bg-2: #fdf6e8;
    --card: rgba(255,255,255,0.62);
    --card-hover: rgba(255,247,235,0.75);
    --accent: #F5A623;
    --accent-2: #FF6F59;
    --sage: #3FA66B;
    --text-main: #1F3540;
    --text-dim: #4C6672;
    --border-color: rgba(31,92,110,0.18);
  }

  /* ---------- LCARS ---------- */
  :root[data-theme="lcars"] {
    --bg-1: #000000;
    --bg-2: #0d0d0d;
    --card: #0d0d0d;
    --card-hover: #161616;
    --accent: #FF9F1C;
    --accent-2: #FF6B6B;
    --sage: #B5D96C;
    --text-main: #FFE3BA;
    --text-dim: #C9A97E;
    --border-color: rgba(255,159,28,0.3);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 20% -10%, rgba(217,132,15,0.16) 0%, transparent 45%),
                radial-gradient(circle at 90% 0%, rgba(31,146,84,0.14) 0%, transparent 40%),
                radial-gradient(circle at 50% 110%, rgba(156,63,174,0.08) 0%, transparent 50%),
                linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
    color: var(--text-main);
  }
  [data-theme="neon"] body {
    background: radial-gradient(circle at top left, #1e1b4b 0, #0b1120 45%, #020617 100%);
  }

  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  header {
    text-align: center;
    margin-bottom: 48px;
  }

  header .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #201205;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 18px;
  }

  header h1 {
    font-size: clamp(28px, 4vw, 40px);
    margin: 0 0 10px;
    letter-spacing: -0.02em;
  }

  header p {
    color: var(--text-dim);
    font-size: 15px;
    margin: 0;
  }

  section.section-title {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 40px 0 16px;
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  section.section-title::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--border-color), transparent);
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border-color);
    border-top: 4px solid var(--sage);
    border-radius: 18px;
    transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
  }
  [data-theme="neon"] .card {
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  [data-theme="sunshine"] .card {
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  /* Spreadsheet card */
  .file-card {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 22px 24px;
    margin-bottom: 25px;
    text-decoration: none;
    color: inherit;
  }

  .file-card:hover {
    border-color: rgba(219, 106, 46, 0.5);
    background: var(--card-hover);
    transform: translateY(-2px);
  }

  a.file-card.old-card {
    border-top-color: rgb(79, 143, 219) !important;
  }

  .file-icon {
    flex-shrink: 0;
    width: 56px;
    height: 56px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    background: linear-gradient(135deg, #2FAE6B, #0F5C34);
    box-shadow: 0 6px 18px rgba(15, 92, 52, 0.3);
  }

  .file-info {
    flex: 1;
    min-width: 0;
  }

  .file-info .name {
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .file-info .meta {
    font-size: 13px;
    color: var(--text-dim);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .file-info .meta span::before {
    content: "•";
    margin-right: 10px;
    color: var(--border-color);
  }

  .file-info .meta span:first-child::before {
    content: "";
    margin-right: 0;
  }

  .download-pill {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(219, 106, 46, 0.12);
    color: var(--accent-2);
    border: 1px solid rgba(219, 106, 46, 0.35);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }

  .file-card:hover .download-pill {
    background: var(--accent);
    color: #201205;
    border-color: var(--accent);
  }

  /* the bare "footer" element selector that lived here was overriding the
     shared site-wide footer (#site-footer) — this page has no in-page
     footer of its own, so there was nothing else for it to legitimately
     target; removed rather than rescoped */
</style>
</head>

  <div class="wrap">

    </header>


    <section class="section-title">Downloads</section>

    <a class="card file-card" href="files/Nates F.I.R.E. Spreadsheet 15.0.xlsm" download>
      <div class="file-icon">📊</div>
      <div class="file-info">
        <p class="name">Nates F.I.R.E. Spreadsheet 15.0.xlsm</p>
        <div class="meta">
          <span>Excel Macro-Enabled Workbook</span>
          <span>.xlsm</span>
        </div>
      </div>
      <span class="download-pill">⬇ Download</span>
    </a>

    <a class="card file-card old-card" href="files/Nates F.I.R.E. Spreadsheet 13.0.xlsm" download>
      <div class="file-icon">📊</div>
      <div class="file-info">
        <p class="name">Nates F.I.R.E. Spreadsheet 13.0.xlsm</p>
        <div class="meta">
          <span>Excel Macro-Enabled Workbook</span>
          <span>.xlsm</span>
        </div>
      </div>
      <span class="download-pill">⬇ Download</span>
    </a>

  </div>

<footer id="site-footer"></footer>

</body>
</html>
